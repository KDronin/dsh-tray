<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>通知</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    user-select: none;
  }
  .wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card {
    position: relative;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(21, 24, 43, 0.97), rgba(12, 14, 28, 0.97));
    border: 1px solid transparent;
    background-clip: padding-box;
    display: flex;
    align-items: center;
    padding: 16px 18px;
    opacity: 0;
    transform: translateX(46px) scale(0.97);
    transition: opacity .3s ease, transform .34s cubic-bezier(.2, 1.4, .4, 1);
    cursor: default;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.65), rgba(167, 139, 250, 0.55));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .card.show { opacity: 1; transform: translateX(0) scale(1); }
  .card.hide { opacity: 0; transform: translateX(46px) scale(0.97); }
  .icon {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 13px;
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.16), rgba(129, 140, 248, 0.2));
    border: 1px solid rgba(129, 140, 248, 0.28);
    display: flex; align-items: center; justify-content: center;
    margin-right: 14px;
    box-shadow: 0 0 22px rgba(99, 102, 241, 0.3);
  }
  .icon svg { width: 24px; height: 24px; }
  .body { flex: 1; min-width: 0; }
  .title {
    font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
    background: linear-gradient(90deg, #7dd3fc, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .msg {
    margin-top: 4px;
    font-size: 12px;
    color: #9aa1c0;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .time {
    margin-top: 4px;
    font-size: 10.5px;
    color: #5c6280;
  }
  .actions { flex: none; margin-left: 12px; display: flex; flex-direction: column; gap: 7px; }
  .btn {
    border: 1px solid rgba(148, 163, 255, 0.22);
    background: rgba(148, 163, 255, 0.1);
    color: #e7e9f6;
    border-radius: 8px;
    padding: 6px 13px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all .16s ease;
  }
  .btn:hover { background: rgba(148, 163, 255, 0.2); }
  .btn.primary {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.92), rgba(129, 140, 248, 0.92));
    border: none; color: #08111f; font-weight: 700;
    box-shadow: 0 5px 16px rgba(56, 189, 248, 0.3);
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { color: #9aa1c0; background: transparent; border-color: rgba(148, 163, 255, 0.14); }
  .btn.ghost:hover { background: rgba(251, 113, 133, 0.12); color: #fb7185; border-color: rgba(251, 113, 133, 0.25); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="g" x1="4" y1="3" x2="20" y2="21">
            <stop offset="0" stop-color="#22d3ee" />
            <stop offset="1" stop-color="#a78bfa" />
          </linearGradient>
        </defs>
        <path d="M13.6 2.6 5.4 13.4h5.2l-1.9 8 8.2-10.8h-5.2l1.9-8Z" fill="url(#g)" />
      </svg>
    </div>
    <div class="body">
      <div class="title" id="t"></div>
      <div class="msg" id="m"></div>
      <div class="time" id="ts"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="view">查看</button>
      <button class="btn ghost" id="close">关闭</button>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  document.getElementById('t').textContent = q.get('title') || '任务已完成'
  document.getElementById('m').textContent = q.get('message') || ''
  const ts = Number(q.get('ts') || Date.now())
  document.getElementById('ts').textContent = new Date(ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
  const card = document.getElementById('card')
  requestAnimationFrame(() => card.classList.add('show'))
  document.getElementById('view').addEventListener('click', () => window.api.notifyView())
  document.getElementById('close').addEventListener('click', () => window.api.notifyClose())
  window.api.onFadeOut(() => {
    card.classList.add('hide')
    setTimeout(() => window.close(), 260)
  })
</script>
</body>
</html>
